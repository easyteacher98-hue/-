# Render Blueprint (무료 Node 웹 서비스)
# Render 대시보드에서 이 저장소를 연결하면 아래 설정으로 서버가 자동 생성됩니다.
#   원클릭 배포: https://render.com/deploy?repo=https://github.com/easyteacher98-hue/-
#
# 참고: Render Blueprint 스펙에서 예전 `env` 필드는 `runtime` 으로 대체되었습니다.
services:
  - type: web
    name: halligalli-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GROUP_CAPACITY
        value: "4"
